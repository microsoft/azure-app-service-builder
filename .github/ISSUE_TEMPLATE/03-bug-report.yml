name: Bug report
description: Report unexpected product behavior with sanitized reproduction steps.
labels:
  - bug
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        Report unexpected behavior anywhere in Azure App Service Builder.
        [Search existing issues](https://github.com/microsoft/azure-app-service-builder/issues?q=is%3Aissue) first.
        Treat your title, responses, comments, and attachments as public. Do not share email addresses, account or contact details, credentials, subscription or resource IDs, customer data, or confidential diagnostics. Do not attach raw logs, network captures, or diagnostic bundles; use a minimal sanitized example.
        For account-specific or urgent problems, use [Azure support options](https://azure.microsoft.com/support/options/). Report vulnerabilities privately using [Microsoft's security guidance](https://aka.ms/SECURITY.md), not this form.
  - type: textarea
    id: description
    attributes:
      label: Bug description
      description: Describe the unexpected behavior and its impact.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide the smallest sanitized example and steps that reproduce the problem. If you cannot reproduce it, describe what you observed.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead? Use a sanitized summary rather than raw diagnostics.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Product area
      description: Optional context; these areas do not imply available or supported capabilities.
      options:
        - Portal
        - CLI
        - Build or deployment
        - Running applications
        - Documentation
        - Other or unsure
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: Environment and regression context
      description: Optional sanitized context such as browser or tool version, operating system, Azure region, or whether this worked previously. Omit account details, resource names and IDs, URLs containing identifiers or tokens, and raw diagnostics.
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Public sharing acknowledgement
      options:
        - label: I understand that this submission is intended for public sharing, and I have removed personal, sensitive, and confidential information. This is not a security vulnerability report.
          required: true
